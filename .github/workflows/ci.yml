name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

  # Privacy guard: ensure no code logs KeyEvent or KeyCode values (§8)
  privacy-lint:
    name: Privacy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no KeyEvent/KeyCode formatting in logging calls
        run: |
          # Fail if any tracing macro or println formats a KeyEvent or KeyCode
          if grep -rn 'tracing::\|println!\|eprintln!\|format!' crates/ \
             | grep -E '(KeyEvent|KeyCode)' \
             | grep -v '//'; then
            echo "ERROR: logging call formats a KeyEvent or KeyCode — privacy violation"
            exit 1
          fi
          echo "Privacy lint passed."
