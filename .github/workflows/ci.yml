name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build Release (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release

      - name: Upload Linux Binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: clack-linux-x86_64
          path: target/release/clack

      - name: Build Release (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/clack-macos target/aarch64-apple-darwin/release/clack target/x86_64-apple-darwin/release/clack

      - name: Upload macOS Binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clack-macos
          path: target/release/clack-macos

  # Privacy guard: ensure no code logs key codes or key events (§8)
  privacy-lint:
    name: Privacy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no logging calls expose key codes or key events
        run: |
          # Match info!/debug!/trace!/warn!/error!/println! calls whose argument
          # text contains any of: code, ev, event, KeyEvent, KeyCode.
          # Exclude: lines with a "// privacy-ok:" annotation, examples/ dirs,
          # and pure comments (lines whose first non-whitespace chars are //).
          HITS=$(grep -rnE \
            '\b(info|debug|trace|warn|error|println|eprintln)!\s*\(' \
            crates/ \
            --include='*.rs' \
            | grep -v 'examples/' \
            | grep -vE '^\s*//' \
            | grep -v '// privacy-ok:' \
            | grep -E '\b(code|[^a-z]ev[^a-z]|event|KeyEvent|KeyCode)\b' \
            || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: logging call may expose key data — privacy violation:"
            echo "$HITS"
            echo ""
            echo "If this is intentional, add a trailing  // privacy-ok: <reason>"
            exit 1
          fi
          echo "Privacy lint passed."
